<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel · Descomplica Guarujá</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EDE4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" href="/favicon.png">
<style>/* fontes próprias: chegam com o primeiro paint, sem troca tardia (CLS) */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fraunces-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Jost';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/jost-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* fallbacks com métricas casadas: o texto provisório ocupa a mesma altura, sem empurrar o layout */
@font-face{font-family:'Fraunces-fb';src:local('Georgia'),local('Times New Roman');size-adjust:111.32%;ascent-override:87.86%;descent-override:22.91%;line-gap-override:0%}
@font-face{font-family:'Jost-fb';src:local('Arial'),local('Helvetica Neue');size-adjust:93.76%;ascent-override:114.12%;descent-override:39.99%;line-gap-override:0%}
@font-face{font-family:'Allura-fb';src:local('Georgia'),local('Times New Roman');size-adjust:86.24%;ascent-override:92.76%;descent-override:52.18%;line-gap-override:0%}
@font-face{font-family:'Allura';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/allura-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/" aria-label="Descomplica Guarujá">
      <img src="/logo.webp" width="40" height="40" alt="" aria-hidden="true">
      <span class="brand-t"><b>DESCOMPLICA</b><span class="script">Painel</span></span>
    </a>
    <nav class="top-cta">
      <button class="tab" id="sair" hidden>Sair</button>
    </nav>
  </div>
</header>

<main>
<!-- login -->
<section id="secLogin">
  <div class="wrap">
    <div class="login form-claro">
      <p class="eyebrow">Acesso restrito</p>
      <h2 style="margin:var(--s3) 0 var(--s4);font-size:1.5rem">Entrar no painel</h2>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" placeholder="voce@descomplicaguaruja.com.br">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••">
      </div>
      <p class="erro" id="erroLogin" role="alert" style="color:var(--danger)"></p>
      <button class="btn btn-primary btn-block" id="entrar" style="width:100%">Entrar</button>
    </div>
  </div>
</section>

<!-- painel -->
<section id="secPainel" hidden>
  <div class="wrap">
    <div class="painel-head">
      <div>
        <p class="eyebrow">Operação</p>
        <h2 style="margin-top:var(--s2);font-size:1.7rem">Pedidos e rede</h2>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true"  data-aba="pedidos">Pedidos <span id="nPed"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-aba="fornecedores">Fornecedores <span id="nFor"></span></button>
      </div>
    </div>

    <div id="abaPedidos">
      <div class="tabs" style="margin-bottom:var(--s4)">
        <button class="tab filtro" aria-selected="true"  data-f="todos">Todos</button>
        <button class="tab filtro" aria-selected="false" data-f="novo">Novos</button>
        <button class="tab filtro" aria-selected="false" data-f="em_proposta">Em proposta</button>
        <button class="tab filtro" aria-selected="false" data-f="aceito">Aceitos</button>
      </div>
      <div class="lista" id="listaPedidos"></div>
    </div>

    <div id="abaFornecedores" hidden>
      <div class="lista" id="listaFornecedores"></div>
    </div>
  </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var SUPA="https://cuaocjxofaizefzcxlyc.supabase.co";
  var ANON="sb_publishable_ia1xhkkK8Pb_gD0Wc8jmXA_71wecTI0";
  var db = window.supabase.createClient(SUPA, ANON);

  var OCASIAO={bodas:"Bodas",pedido:"Pedido de casamento",aniversario:"Aniversário",casamento:"Casamento íntimo",confraternizacao:"Confraternização",outro:"Outra"};
  var PERIODO={manha:"Manhã",tarde:"Tarde",por_do_sol:"Pôr do sol",noite:"Noite"};
  var LOCAL={minha_casa:"Casa própria",casa_veraneio:"Casa de veraneio",pousada:"Pousada",espaco:"Espaço",praia:"Frente-mar",a_definir:"A definir"};
  var FAIXA={intima:"Íntima",reunida:"Reunida",completa:"Completa"};
  var CAT={buffet:"Buffet",foto:"Fotografia",som:"Som e DJ",bolo:"Bolo e doces",decoracao:"Decoração",espaco:"Espaço",bebidas:"Bebidas",outro:"Outro"};
  var STATUS={novo:"Novo",em_proposta:"Em proposta",proposta_enviada:"Proposta enviada",aceito:"Aceito",perdido:"Perdido",pendente:"Pendente",aprovado:"Aprovado",recusado:"Recusado"};

  var pedidos=[], fornecedores=[], filtro="todos";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function data(d){ return d ? d.split("-").reverse().join("/") : "a combinar"; }
  function quando(ts){
    var h=Math.floor((Date.now()-new Date(ts))/36e5);
    return h<1?"agora há pouco":h<24?("há "+h+"h"):("há "+Math.floor(h/24)+"d");
  }
  function wa(n){ return "https://wa.me/55"+String(n).replace(/\D/g,""); }

  async function carregar(){
    var a = await db.rpc("descomplica_painel_pedidos");
    var b = await db.rpc("descomplica_painel_fornecedores");
    if(a.error || b.error){ return sair(); }
    pedidos = a.data || []; fornecedores = b.data || [];
    document.getElementById("nPed").textContent = "(" + pedidos.length + ")";
    document.getElementById("nFor").textContent = "(" + fornecedores.length + ")";
    render();
  }

  function render(){
    var lp=document.getElementById("listaPedidos");
    var vis = filtro==="todos" ? pedidos : pedidos.filter(function(p){ return p.status===filtro; });
    lp.innerHTML = vis.length ? vis.map(function(p){
      return '<article class="card">'
        + '<div class="card-top"><b>'+esc(p.nome)+'</b>'
        + '<span class="pill '+(p.status==="novo"?"novo":p.status==="aceito"?"aceito":p.status==="perdido"?"perdido":"")+'">'+(STATUS[p.status]||p.status)+'</span></div>'
        + '<div class="card-meta">'
          + '<span>'+esc(OCASIAO[p.ocasiao]||p.ocasiao)+'</span>'
          + '<span><b>'+p.convidados+'</b> pessoas · '+esc(FAIXA[p.faixa])+'</span>'
          + '<span>'+data(p.data_evento)+(p.periodo?" · "+esc(PERIODO[p.periodo]):"")+'</span>'
          + '<span>'+esc(LOCAL[p.local_tipo]||"—")+'</span>'
          + '<span>'+quando(p.criado_em)+'</span>'
        + '</div>'
        + (p.observacoes ? '<p style="margin-top:var(--s2);font-size:.9rem;color:var(--muted)">'+esc(p.observacoes)+'</p>' : '')
        + '<div class="card-meta" style="margin-top:var(--s3);gap:var(--s2)">'
          + '<a class="tab" href="'+wa(p.whatsapp)+'" target="_blank" rel="noopener">WhatsApp</a>'
          + '<a class="tab" href="/proposta?t='+esc(p.token)+'" target="_blank" rel="noopener">Ver link do cliente</a>'
          + '<button class="tab" data-mudar="pedidos" data-id="'+p.id+'" data-para="em_proposta">Em proposta</button>'
          + '<button class="tab" data-mudar="pedidos" data-id="'+p.id+'" data-para="aceito">Aceito</button>'
          + '<button class="tab" data-mudar="pedidos" data-id="'+p.id+'" data-para="perdido">Perdido</button>'
        + '</div></article>';
    }).join("") : '<div class="vazio">Nenhum pedido nesse filtro ainda.</div>';

    var lf=document.getElementById("listaFornecedores");
    lf.innerHTML = fornecedores.length ? fornecedores.map(function(f){
      return '<article class="card">'
        + '<div class="card-top"><b>'+esc(f.nome)+'</b>'
        + '<span class="pill '+(f.status==="aprovado"?"aceito":f.status==="recusado"?"perdido":"novo")+'">'+(STATUS[f.status]||f.status)+'</span></div>'
        + '<div class="card-meta">'
          + '<span>'+esc(CAT[f.categoria]||f.categoria)+'</span>'
          + '<span>'+(f.aceita_comissao ? '<b>'+f.comissao_pct+'%</b> de comissão' : 'sem comissão')+'</span>'
          + (f.cnpj ? '<span>CNPJ '+esc(f.cnpj)+'</span>' : '<span>sem CNPJ</span>')
          + (f.agenda_url ? '<span><a href="'+esc(f.agenda_url)+'" target="_blank" rel="noopener">agenda</a></span>' : '')
          + '<span>'+quando(f.criado_em)+'</span>'
        + '</div>'
        + (f.observacoes ? '<p style="margin-top:var(--s2);font-size:.9rem;color:var(--muted)">'+esc(f.observacoes)+'</p>' : '')
        + '<div class="card-meta" style="margin-top:var(--s3);gap:var(--s2)">'
          + '<a class="tab" href="'+wa(f.whatsapp)+'" target="_blank" rel="noopener">WhatsApp</a>'
          + '<button class="tab" data-mudar="fornecedores" data-id="'+f.id+'" data-para="aprovado">Aprovar</button>'
          + '<button class="tab" data-mudar="fornecedores" data-id="'+f.id+'" data-para="recusado">Recusar</button>'
        + '</div></article>';
    }).join("") : '<div class="vazio">Nenhum fornecedor cadastrado ainda. Divulgue a página /parceiros.</div>';
  }

  document.addEventListener("click", async function(e){
    var b=e.target.closest("[data-mudar]");
    if(!b) return;
    b.disabled=true;
    var r=await db.rpc("descomplica_mudar_status",{p_tabela:b.dataset.mudar,p_id:b.dataset.id,p_status:b.dataset.para});
    b.disabled=false;
    if(!r.error) carregar();
  });

  document.querySelectorAll("[data-aba]").forEach(function(t){
    t.addEventListener("click",function(){
      document.querySelectorAll("[data-aba]").forEach(function(x){x.setAttribute("aria-selected","false")});
      t.setAttribute("aria-selected","true");
      document.getElementById("abaPedidos").hidden      = t.dataset.aba!=="pedidos";
      document.getElementById("abaFornecedores").hidden = t.dataset.aba!=="fornecedores";
    });
  });
  document.querySelectorAll(".filtro").forEach(function(t){
    t.addEventListener("click",function(){
      document.querySelectorAll(".filtro").forEach(function(x){x.setAttribute("aria-selected","false")});
      t.setAttribute("aria-selected","true"); filtro=t.dataset.f; render();
    });
  });

  function entrou(){
    document.getElementById("secLogin").hidden=true;
    document.getElementById("secPainel").hidden=false;
    document.getElementById("sair").hidden=false;
    carregar();
  }
  function sair(){
    db.auth.signOut();
    document.getElementById("secLogin").hidden=false;
    document.getElementById("secPainel").hidden=true;
    document.getElementById("sair").hidden=true;
  }

  document.getElementById("entrar").addEventListener("click", async function(){
    var btn=this; btn.disabled=true; btn.textContent="Entrando…";
    var r=await db.auth.signInWithPassword({
      email:document.getElementById("email").value.trim(),
      password:document.getElementById("senha").value
    });
    btn.disabled=false; btn.textContent="Entrar";
    if(r.error){ document.getElementById("erroLogin").textContent="E-mail ou senha incorretos."; return; }
    document.getElementById("erroLogin").textContent="";
    entrou();
  });
  document.getElementById("senha").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("entrar").click(); });
  document.getElementById("sair").addEventListener("click", sair);

  db.auth.getSession().then(function(r){ if(r.data.session) entrou(); });
})();
</script>
</body>
</html>
