<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Descomplica Guarujá — símbolo geométrico
       proporções medidas: disco 85%, sol 42% centrado, horizonte +0.20R
       linhas regulares · um azul único · paleta fosca -->
  <defs>
    <clipPath id="d"><circle cx="120" cy="120" r="93"/></clipPath>
  </defs>

  <circle cx="120" cy="120" r="93" fill="#F0C6A4"/>

  <g clip-path="url(#d)">
    <!-- sol centrado, metade inferior atrás das ondas -->
    <circle cx="120" cy="120" r="46" fill="#E2A287" stroke="#FAF4EB" stroke-width="5"/>

    <!-- coração traço fino -->
    <path fill="none" stroke="#FAF4EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="
      M120 118
      C 111 109, 107.5 104, 107.5 98.5
      C 107.5 92.5, 112 89, 116.5 89
      C 118.5 89, 119.5 90.5, 120 92
      C 120.5 90.5, 121.5 89, 123.5 89
      C 128 89, 132.5 92.5, 132.5 98.5
      C 132.5 104, 129 109, 120 118 Z"/>

    <!-- onda direita: entra alta da direita, desce ao centro e segue à esquerda -->
    <path fill="#84A3A6" stroke="#FAF4EB" stroke-width="5" d="
      M27 158
      C 60 150, 90 148, 120 142
      C 155 135, 185 128, 213 126
      L 213 213 L 27 213 Z"/>

    <!-- onda esquerda: crista suave, cruza o sol e mergulha sob a direita -->
    <path fill="#84A3A6" stroke="#FAF4EB" stroke-width="5" d="
      M27 121
      C 55 114, 85 121, 110 134
      C 130 144, 138 152, 150 162
      L 150 213 L 27 213 Z"/>

    <!-- faixa sand inferior -->
    <path fill="#EAD2B6" stroke="#FAF4EB" stroke-width="5" d="
      M27 196
      C 70 184, 150 172, 213 156
      L 213 213 L 27 213 Z"/>
  </g>

  <circle cx="120" cy="120" r="93" fill="none" stroke="#FAF4EB" stroke-width="7"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#CDB295" stroke-width="4"/>
</svg>
