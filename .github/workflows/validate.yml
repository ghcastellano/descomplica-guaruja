name: Validate site and operations app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/static-checks.cjs
  operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: descomplica_local
          POSTGRES_PASSWORD: local-ci
          POSTGRES_DB: descomplica_test
        ports: ['54339:5432']
        options: >-
          --health-cmd "pg_isready -U descomplica_local -d descomplica_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund
      - name: Configure isolated test environment
        run: |
          cat > .env.local <<'ENV'
          APP_MODE=local-test
          APP_ORIGIN=http://127.0.0.1:3001
          DATABASE_URL=postgres://descomplica_local:local-ci@127.0.0.1:54339/descomplica_test
          TEST_DATABASE_URL=postgres://descomplica_local:local-ci@127.0.0.1:54339/descomplica_test
          ENV
          printf 'LOCAL_SECRET=%s\nLOCAL_ACCESS_CODE=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 12)" >> .env.local
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
