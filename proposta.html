<style>/* fontes próprias: chegam com o primeiro paint, sem troca tardia (CLS) */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/fraunces-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Jost';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/jost-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* fallbacks com métricas casadas: o texto provisório ocupa a mesma altura, sem empurrar o layout */
@font-face{font-family:'Fraunces-fb';src:local('Georgia'),local('Times New Roman');size-adjust:111.32%;ascent-override:87.86%;descent-override:22.91%;line-gap-override:0%}
@font-face{font-family:'Jost-fb';src:local('Arial'),local('Helvetica Neue');size-adjust:93.76%;ascent-override:114.12%;descent-override:39.99%;line-gap-override:0%}

@font-face{font-family:'Allura';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/allura-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

<style>
:root{--cream:#F4EDE4;--sand:#E7D8C5;--sand-soft:#EFE5D6;--terracotta:#C8765A;--terracotta-ink:#A35236;--gold:#C9A24B;--gold-soft:#E4CD96;--petrol:#1F4E54;--petrol-deep:#143438;--ink:#2B2B2B;--muted:#6B655E;--white:#FFF;--success:#3F8F5B;--danger:#9C3B2E;--whatsapp:#25D366;--f-serif:'Fraunces','Fraunces-fb',Georgia,serif;--f-sans:'Jost','Jost-fb',-apple-system,'Segoe UI',sans-serif;--f-script:'Allura','Allura-fb',Georgia,serif;--s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--r-sm:8px;--r-md:16px;--r-lg:24px;--r-btn:12px;--sh-sm:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 16px rgba(0,0,0,.10);--sh-lg:0 8px 32px rgba(20,52,56,.12);--dur-fast:150ms;--dur:250ms;--dur-slow:400ms;--ease-out:cubic-bezier(.23,1,.32,1);--maxw:1080px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
h1,h2{font-family:var(--f-serif);color:var(--petrol-deep);line-height:1.12;margin:0;font-weight:600;text-wrap:balance}
h1{font-size:clamp(2rem,5.2vw,3.1rem);letter-spacing:-.022em}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:inherit}
.script{font-family:var(--f-script);color:var(--terracotta-ink)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--s4)}
.eyebrow{font-size:.76rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--terracotta-ink);display:inline-flex;align-items:center;gap:var(--s2)}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold);border-radius:2px}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.top{position:sticky;top:0;z-index:50;background:rgba(244,237,228,.82);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid rgba(231,216,197,.7)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:var(--s2) var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s2);text-decoration:none;min-height:48px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand-t{display:flex;flex-direction:column;line-height:1}
.brand-t b{font-size:.68rem;letter-spacing:.18em;color:var(--petrol-deep);font-weight:600}
.brand-t .script{font-size:1.25rem;margin-top:-2px}
.top-cta{display:flex;align-items:center;gap:var(--s3)}
.top-link{font-size:.92rem;color:var(--muted);text-decoration:none}
@media(max-width:760px){.top-link{display:none}}
.top-wa{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--whatsapp);color:#0b3d1c;text-decoration:none}
.top-wa svg{width:22px;height:22px;fill:currentColor}
.hero{padding:var(--s7) 0 var(--s6);position:relative;overflow:hidden}
.hero h1{margin:var(--s3) 0 var(--s4);max-width:17ch}
.hero .lead{font-size:1.18rem}
.hero-ctas{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:52px;padding:0 var(--s5);border:0;border-radius:var(--r-btn);font-family:inherit;font-size:1rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn-primary{background:var(--petrol-deep);color:var(--cream);box-shadow:var(--sh-md)}
.btn-secondary{background:transparent;color:var(--petrol-deep);border:1.5px solid var(--sand)}
@media(max-width:620px){body{font-size:16px}.wrap{padding:0 var(--s3)}.hero{padding:var(--s6) 0 var(--s5)}.btn{width:100%}.hero-ctas{flex-direction:column}}
</style>
<link rel="preload" as="style" href="/app.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/app.css"></noscript>
<style>
.itens{width:100%;border-collapse:collapse;margin-top:var(--s4)}
.itens th{text-align:left;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 var(--s2) var(--s2)}
.itens td{padding:var(--s3) var(--s2);border-top:1px solid var(--sand);font-size:.95rem;vertical-align:top}
.itens td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.itens .cat{color:var(--muted);font-size:.84rem;display:block}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s2);border-top:2px solid var(--petrol-deep);margin-top:var(--s2)}
.tot b{font-family:var(--f-serif);font-size:1.6rem;color:var(--petrol-deep)}
.nota{background:var(--sand-soft);border-radius:var(--r-md);padding:var(--s4);font-size:.9rem;color:var(--muted);margin-top:var(--s4);line-height:1.6}
@media (max-width:620px){ .itens td,.itens th{padding-left:0;padding-right:0} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/" aria-label="Descomplica Guarujá">
      <img src="/logo.webp" width="40" height="40" alt="" aria-hidden="true">
      <span class="brand-t"><b>DESCOMPLICA</b><span class="script">Guarujá</span></span>
    </a>
    <a class="top-wa" href="https://wa.me/5513988523663" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg>
    </a>
  </div>
</header>

<main>
<section>
  <div class="wrap" style="max-width:760px">
    <div id="carregando" class="vazio">Carregando sua proposta…</div>
    <div id="conteudo" hidden></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap foot">
    <span style="font-size:.9rem">Dúvidas? <a href="https://wa.me/5513988523663" target="_blank" rel="noopener">Chame no WhatsApp</a></span>
    <div class="foot-c"><span>© 2026 Descomplica Guarujá · Guarujá, SP</span></div>
  </div>
</footer>

<script>
(function(){
  "use strict";
  var SUPA="https://cuaocjxofaizefzcxlyc.supabase.co";
  var ANON="sb_publishable_ia1xhkkK8Pb_gD0Wc8jmXA_71wecTI0";
  var OCASIAO={bodas:"bodas",pedido:"pedido de casamento",aniversario:"aniversário",casamento:"casamento íntimo",confraternizacao:"confraternização",outro:"celebração"};
  var PERIODO={manha:"de manhã",tarde:"à tarde",por_do_sol:"no pôr do sol",noite:"à noite"};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function brl(v){ return "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function data(d){ return d ? d.split("-").reverse().join("/") : "a combinar"; }

  var token = new URLSearchParams(location.search).get("t");
  var box = document.getElementById("conteudo");
  var load = document.getElementById("carregando");

  function erro(msg){
    load.hidden=true; box.hidden=false;
    box.innerHTML = '<div class="vazio"><h2 style="font-size:1.3rem;margin-bottom:var(--s2)">'+esc(msg)+'</h2>'
      + '<p style="margin-bottom:var(--s4)">Confira o link que enviamos pelo WhatsApp ou fale com a gente.</p>'
      + '<a class="btn btn-wa" href="https://wa.me/5513988523663" target="_blank" rel="noopener">Falar no WhatsApp</a></div>';
  }

  if(!token) return erro("Link sem identificação.");

  fetch(SUPA+"/rest/v1/rpc/descomplica_ver_proposta",{
    method:"POST", headers:{"apikey":ANON,"Content-Type":"application/json"},
    body: JSON.stringify({p_token: token})
  }).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
    load.hidden=true; box.hidden=false;
    var cab = '<p class="eyebrow">Sua celebração</p>'
      + '<h1 style="margin:var(--s3) 0 var(--s3);font-size:clamp(1.7rem,4.4vw,2.4rem)">Olá, '+esc(d.cliente)+'.</h1>'
      + '<p class="lead">Seu '+esc(OCASIAO[d.ocasiao]||"evento")+' para <b>'+d.convidados+' pessoas</b>, '
      + (d.data ? 'no dia <b>'+data(d.data)+'</b>' : 'com data a combinar')
      + (d.periodo ? ' '+esc(PERIODO[d.periodo]) : '') + '.</p>';

    if(!d.proposta){
      box.innerHTML = cab
        + '<div class="nota" style="margin-top:var(--s5)"><b style="color:var(--petrol-deep)">Estamos montando sua proposta.</b><br>'
        + 'Já recebemos seu pedido e estamos cruzando a data com a agenda dos fornecedores. '
        + 'Você recebe tudo por aqui e pelo WhatsApp em até 48 horas.</div>'
        + '<div class="acoes" style="margin-top:var(--s5)"><a class="btn btn-wa" href="https://wa.me/5513988523663?text='
        + encodeURIComponent("Olá! Queria falar sobre minha proposta. Protocolo "+token.slice(0,8).toUpperCase()) + '" target="_blank" rel="noopener">Falar no WhatsApp</a></div>';
      return;
    }

    var p = d.proposta;
    var itens = (p.itens||[]).map(function(i){
      return '<tr><td><b>'+esc(i.descricao||i.categoria)+'</b>'
        + '<span class="cat">'+esc(i.fornecedor||"")+(i.tipo==="proprio"?" · Descomplica":"")+'</span></td>'
        + '<td>'+brl(i.valor)+'</td></tr>';
    }).join("");

    box.innerHTML = cab
      + '<table class="itens"><thead><tr><th>Item</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+itens+'</tbody></table>'
      + '<div class="tot"><span>Total da celebração</span><b>'+brl(p.valor_total)+'</b></div>'
      + (p.sinal ? '<div class="tot" style="border-top:1px solid var(--sand)"><span>Sinal para reservar a data</span><b style="font-size:1.25rem;color:var(--terracotta-ink)">'+brl(p.sinal)+'</b></div>' : '')
      + '<div class="nota"><b style="color:var(--petrol-deep)">Como funciona o pagamento.</b><br>'
      + 'Você paga ao Descomplica apenas os serviços próprios e a coordenação. Cada fornecedor é contratado em seu nome e emite a nota diretamente para você. '
      + 'Assim você vê exatamente quanto custa cada coisa, sem margem escondida.'
      + (p.validade ? '<br><br>Proposta válida até <b>'+data(p.validade)+'</b>.' : '') + '</div>'
      + '<div class="acoes" style="margin-top:var(--s5)">'
      + '<a class="btn btn-primary" href="https://wa.me/5513988523663?text='
      + encodeURIComponent("Olá! Quero aprovar a proposta. Protocolo "+token.slice(0,8).toUpperCase()) + '" target="_blank" rel="noopener">Quero aprovar</a>'
      + '<a class="btn btn-secondary" href="https://wa.me/5513988523663?text='
      + encodeURIComponent("Olá! Tenho uma dúvida sobre a proposta. Protocolo "+token.slice(0,8).toUpperCase()) + '" target="_blank" rel="noopener">Tirar uma dúvida</a></div>';
  }).catch(function(){ erro("Não encontramos essa proposta."); });
})();
</script>
</body>
</html>
